name: Publish Container & MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lukecele/citeguard-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-registry:
    needs: publish-oci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Wait for PyPI packages referenced in server.json
        run: |
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request

          with open("server.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          pypi_pkgs = [
              (p["identifier"], p["version"])
              for p in data.get("packages", [])
              if p.get("registryType") == "pypi" and p.get("identifier") and p.get("version")
          ]
          for name, version in pypi_pkgs:
              url = f"https://pypi.org/pypi/{name}/{version}/json"
              print(f"Waiting for PyPI package {name}=={version} ({url})...")
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(url, timeout=10) as resp:
                          if resp.status == 200:
                              print(f"PyPI package {name}=={version} is live.")
                              break
                  except urllib.error.HTTPError as e:
                      print(f"Attempt {attempt + 1}/30: HTTP {e.code}")
                  except Exception as e:
                      print(f"Attempt {attempt + 1}/30: {e}")
                  time.sleep(10)
              else:
                  raise SystemExit(f"Timed out waiting for PyPI package {name}=={version}")
          PY

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
