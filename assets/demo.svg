<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1323"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <style>
      .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; font-size: 13.5px; }
      .bold { font-weight: 700; }
      .cyan { fill: #38bdf8; }
      .teal { fill: #2dd4bf; }
      .green { fill: #4ade80; }
      .yellow { fill: #facc15; }
      .red { fill: #f87171; }
      .magenta { fill: #e879f9; }
      .muted { fill: #64748b; }
      .white { fill: #e2e8f0; }
      .fade-1 { opacity: 0; animation: appear 0.3s ease forwards 0.2s; }
      .fade-2 { opacity: 0; animation: appear 0.4s ease forwards 0.8s; }
      .fade-3 { opacity: 0; animation: appear 0.4s ease forwards 1.5s; }
      .fade-4 { opacity: 0; animation: appear 0.4s ease forwards 2.2s; }
      .fade-5 { opacity: 0; animation: appear 0.4s ease forwards 2.9s; }
      .fade-6 { opacity: 0; animation: appear 0.4s ease forwards 3.6s; }
      @keyframes appear { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="6" y="6" width="908" height="508" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="6" y="6" width="908" height="38" rx="14" fill="#111c30"/>
  <rect x="6" y="30" width="908" height="14" fill="#111c30"/>
  <line x1="6" y1="44" x2="914" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="28" cy="25" r="6.5" fill="#ef4444"/>
  <circle cx="48" cy="25" r="6.5" fill="#f59e0b"/>
  <circle cx="68" cy="25" r="6.5" fill="#22c55e"/>
  <text x="460" y="29" text-anchor="middle" class="term-text muted bold">citeguard — Anti-Hallucination Citation &amp; DOI Verifier (MCP + CLI)</text>

  <!-- Command Prompt -->
  <g class="fade-1">
    <text x="28" y="76" class="term-text teal bold">❯</text>
    <text x="46" y="76" class="term-text white bold">citeguard audit draft_review.md --strict</text>
  </g>

  <!-- Banner -->
  <g class="fade-2">
    <rect x="28" y="92" width="864" height="58" rx="8" fill="#0f2238" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="46" y="116" class="term-text cyan bold">🛡️  CiteGuard MCP v0.1.0 — Anti-Hallucination Citation &amp; DOI Verifier</text>
    <text x="46" y="137" class="term-text muted">Crossref · DataCite / CERN Zenodo · PubMed (NCBI) · OpenAlex · arXiv</text>
  </g>

  <!-- Summary Bar -->
  <g class="fade-2">
    <text x="28" y="180" class="term-text white bold">Citation Integrity Score:</text>
    <text x="242" y="180" class="term-text yellow bold">50.0%</text>
    <text x="300" y="180" class="term-text muted">(</text>
    <text x="309" y="180" class="term-text green bold">2 Verified</text>
    <text x="394" y="180" class="term-text muted">·</text>
    <text x="408" y="180" class="term-text yellow bold">1 Chimera Mismatch</text>
    <text x="572" y="180" class="term-text muted">·</text>
    <text x="586" y="180" class="term-text red bold">1 Fabricated/404</text>
    <text x="728" y="180" class="term-text muted">·</text>
    <text x="742" y="180" class="term-text magenta bold">1 Retracted</text>
    <text x="836" y="180" class="term-text muted">)</text>
    <line x1="28" y1="195" x2="892" y2="195" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- Result 01: Verified -->
  <g class="fade-3">
    <text x="28" y="222" class="term-text white bold">#01</text>
    <text x="64" y="222" class="term-text green bold">✔ VERIFIED</text>
    <text x="160" y="222" class="term-text muted">[Crossref] —</text>
    <text x="266" y="222" class="term-text white bold">DOI 10.1038/s41586-021-03819-2</text>
    <text x="64" y="242" class="term-text muted">Jumper, John et al. (2021) · Highly accurate protein structure prediction with AlphaFold · Nature</text>
  </g>

  <!-- Result 02: Verified arXiv -->
  <g class="fade-3">
    <text x="28" y="274" class="term-text white bold">#02</text>
    <text x="64" y="274" class="term-text green bold">✔ VERIFIED</text>
    <text x="160" y="274" class="term-text muted">[arXiv]    —</text>
    <text x="266" y="274" class="term-text white bold">arXiv:1706.03762</text>
    <text x="64" y="294" class="term-text muted">Vaswani, Ashish et al. (2017) · Attention Is All You Need · arXiv:1706.03762</text>
  </g>

  <!-- Result 03: Chimera Mismatch -->
  <g class="fade-4">
    <text x="28" y="328" class="term-text white bold">#03</text>
    <text x="64" y="328" class="term-text yellow bold">⚠ CHIMERA MISMATCH</text>
    <text x="228" y="328" class="term-text muted">[Crossref] —</text>
    <text x="334" y="328" class="term-text white bold">BibTeX @smith2024llm</text>
    <text x="64" y="348" class="term-text red">↳ CHIMERA TITLE MISMATCH: Claimed title 'Autonomous LLM Agents in Clinical Oncology' does not</text>
    <text x="80" y="366" class="term-text red">match actual registry title for 10.1038/nature14539 ('Deep learning', LeCun et al. 2015, sim=8%).</text>
  </g>

  <!-- Result 04: Fabricated DOI -->
  <g class="fade-5">
    <text x="28" y="400" class="term-text white bold">#04</text>
    <text x="64" y="400" class="term-text red bold">✘ FABRICATED / 404</text>
    <text x="228" y="400" class="term-text muted">           —</text>
    <text x="334" y="400" class="term-text white bold">DOI 10.1038/s41591-025-99999-z</text>
    <text x="64" y="420" class="term-text red">↳ Identifier '10.1038/s41591-025-99999-z' does not resolve in Crossref, DataCite, PubMed, or arXiv.</text>
  </g>

  <!-- Result 05: Retracted -->
  <g class="fade-6">
    <text x="28" y="454" class="term-text white bold">#05</text>
    <text x="64" y="454" class="term-text magenta bold">🚨 RETRACTED</text>
    <text x="178" y="454" class="term-text muted">[Crossref] —</text>
    <text x="284" y="454" class="term-text white bold">DOI 10.1016/S0140-6736(97)11096-0</text>
    <text x="64" y="474" class="term-text magenta">↳ RETRACTED PAPER ALERT: Flagged as RETRACTED in Crossref &amp; OpenAlex (The Lancet, 1998).</text>
    <line x1="28" y1="490" x2="892" y2="490" stroke="#1e293b" stroke-width="1.5"/>
  </g>
</svg>
